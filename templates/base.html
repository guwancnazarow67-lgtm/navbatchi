{%- from "_icons.html" import icon -%}
<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}NAVBATCHI{% endblock %} · NAVBATCHI</title>
<meta name="csrf-token" content="{{ csrf_token() }}">
<meta name="theme-color" content="#5b6cff">
<link rel="manifest" href="{{ url_for('manifest') }}">
<link rel="icon" href="{{ url_for('static', filename='img/icon.svg') }}" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='img/icon-192.png') }}">
<script src="{{ url_for('static', filename='js/theme.js') }}?v={{ asset_v }}"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v={{ asset_v }}">
{% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}" data-role="{{ role }}" data-vapid="{{ vapid_public_key }}">
{% block body %}{% endblock %}
<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="{{ url_for('static', filename='js/app.js') }}?v={{ asset_v }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
